{% extends "base.html" %}

{% block title %}New issue{% endblock %}

{% block content %}
<div class="form-header">
    <h1>New issue</h1>
</div>

<form method="post" class="issue-form">
    {% csrf_token %}

    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <ul class="field-errors">
            {% for error in field.errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
    {% endfor %}

    <div class="form-actions">
        <button type="submit" class="btn btn-new">Create</button>
        <a href="{% url 'issue_list' %}" class="btn btn-cancel">Cancel</a>
    </div>
</form>
{% endblock %}
