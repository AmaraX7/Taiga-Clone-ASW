{% extends "base.html" %}

{% block title %}Delete Issue{% endblock %}

{% block content %}
<div class="issues-header" style="margin-bottom: 20px;">
    <h1>Delete issue #{{ issue.id }}</h1>
</div>

<div class="delete-confirmation" style="background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 4px;">
    <p>Are you sure you want to delete the issue <strong>"{{ issue.subject }}"</strong>?</p>
    <p style="color: #666; font-size: 0.9em;">This action cannot be undone.</p>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <a href="{% url 'issue_list' %}" class="btn" style="background: #f1f2f3; color: #333; text-decoration: none; padding: 8px 16px; border-radius: 4px; display: inline-block;">Cancel</a>
        <button type="submit" class="btn btn-danger" style="background-color: #d9534f; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; margin-left: 10px;">Yes, delete it</button>
    </form>
</div>
{% endblock %}
