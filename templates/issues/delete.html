{% extends "base.html" %}

{% block title %}Delete Issue{% endblock %}

{% block content %}
<div class="delete-overlay">
    <div class="delete-dialog">
        <h2 class="delete-title">Delete issue</h2>
        <p class="delete-question">Are you sure you want to delete?</p>
        <p class="delete-subject">{{ issue.subject }}</p>

        <form method="post" class="delete-actions">
            {% csrf_token %}
            <a href="{% url 'issue_detail' issue.pk %}" class="delete-cancel">Cancel</a>
            <button type="submit" class="delete-confirm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                </svg>
                DELETE
            </button>
        </form>
    </div>
</div>

<style>
    .delete-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .delete-dialog {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.14);
        padding: 40px 48px;
        min-width: 340px;
        max-width: 460px;
        text-align: center;
    }

    .delete-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 16px;
    }

    .delete-question {
        font-size: 1rem;
        color: #374151;
        margin: 0 0 4px;
    }

    .delete-subject {
        font-size: 1rem;
        color: #374151;
        font-weight: 600;
        margin: 0 0 28px;
    }

    .delete-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin: 0;
    }

    .delete-cancel {
        font-size: 0.95rem;
        color: #4da6c8;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 6px;
        transition: opacity 0.15s;
    }

    .delete-cancel:hover {
        opacity: 0.75;
    }

    .delete-confirm {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #e84057;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: .06em;
        padding: 10px 22px;
        cursor: pointer;
        transition: background 0.15s;
    }

    .delete-confirm:hover {
        background: #c72d42;
    }

    .delete-confirm svg {
        flex-shrink: 0;
    }
</style>
{% endblock %}
