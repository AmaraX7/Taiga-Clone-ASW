{% extends "base.html" %}

{% block title %}Edit Status: {{ status.name }}{% endblock %}

{% block content %}
<div class="form-header">
    <h1>Edit status: {{ status.name }}</h1>
</div>

<div class="detail-card" style="max-width:540px;margin-top:24px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_name">Name</label>
            <input type="text" id="id_name" name="name" value="{{ status.name }}" required>
        </div>

        <div class="form-group">
            <label>Color</label>
            <div class="taiga-color-picker">
                <input type="hidden" id="id_color" name="color" value="{{ status.color }}">
                <input type="color" class="taiga-color-native" value="{{ status.color }}" data-hidden-target="id_color">
                <div class="taiga-color-swatches">
                    <button type="button" class="taiga-color-swatch" data-hidden-target="id_color" data-color="#83eede" style="background:#83eede;"></button>
                    <button type="button" class="taiga-color-swatch" data-hidden-target="id_color" data-color="#e2b93b" style="background:#e2b93b;"></button>
                    <button type="button" class="taiga-color-swatch" data-hidden-target="id_color" data-color="#4c9aff" style="background:#4c9aff;"></button>
                    <button type="button" class="taiga-color-swatch" data-hidden-target="id_color" data-color="#f5a623" style="background:#f5a623;"></button>
                    <button type="button" class="taiga-color-swatch" data-hidden-target="id_color" data-color="#e44057" style="background:#e44057;"></button>
                    <button type="button" class="taiga-color-swatch" data-hidden-target="id_color" data-color="#70728f" style="background:#70728f;"></button>
                </div>
                <code class="taiga-color-code" data-code-target="id_color">{{ status.color }}</code>
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_closed" {% if status.is_closed %}checked{% endif %}>
                Closed status
                <span style="font-size:12px;color:#70728f;margin-left:4px;">
                    (issues with this status count as closed)
                </span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-new">Save changes</button>
            <a href="{% url 'settings_view' %}" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>

<style>
.taiga-color-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border: 1px solid #d8dee9;
    border-radius: 8px;
    background: #f8fafc;
}

.taiga-color-native {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    padding: 0;
}

.taiga-color-swatches {
    display: flex;
    align-items: center;
    gap: 6px;
}

.taiga-color-swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.16);
    cursor: pointer;
    padding: 0;
}

.taiga-color-code {
    margin-left: auto;
    color: #70728f;
    font-size: 12px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    cursor: pointer;
}
</style>

<script>
function updateTaigaColor(targetId, value) {
    const hidden = document.getElementById(targetId);
    if (!hidden) {
        return;
    }
    hidden.value = value;
    document.querySelectorAll(`[data-hidden-target="${targetId}"]`).forEach((el) => {
        if (el.matches('input[type="color"]')) {
            el.value = value;
        }
    });
    document.querySelectorAll(`[data-code-target="${targetId}"]`).forEach((el) => {
        el.textContent = value;
    });
}

document.querySelectorAll('.taiga-color-native').forEach((picker) => {
    picker.addEventListener('input', (event) => {
        updateTaigaColor(event.currentTarget.dataset.hiddenTarget, event.currentTarget.value);
    });
});

document.querySelectorAll('.taiga-color-swatch').forEach((swatch) => {
    swatch.addEventListener('click', (event) => {
        updateTaigaColor(
            event.currentTarget.dataset.hiddenTarget,
            event.currentTarget.dataset.color,
        );
    });
});
</script>
{% endblock %}
