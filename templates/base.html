{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Issue Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="{% url 'issue_list' %}" class="navbar-brand">Issue Tracker</a>
        </div>
        <div class="navbar-right">
            {% if user.is_authenticated %}
                <span class="navbar-user">{{ user.username }}</span>
                <form method="post" action="{% url 'account_logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-nav-logout">Sign out</button>
                </form>
            {% else %}
                <a href="{% url 'account_login' %}" class="btn-nav-link btn-nav-link--primary">Sign in</a>
            {% endif %}
        </div>
    </nav>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="alert alert--{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
