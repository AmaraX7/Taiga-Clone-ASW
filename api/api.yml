          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
                  example: 5
      responses:
        "201":
          description: Watcher added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watcher'
        "200":
          description: User was already watching
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 'Already watching.'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /issues/{issue_id}/watchers/{user_id}/:
    delete:
