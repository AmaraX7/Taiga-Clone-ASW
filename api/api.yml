                $ref: '#/components/schemas/IssueTag'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [catalogs]
      summary: Update a tag
      operationId: updateTag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTagInput'
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [catalogs]
      summary: Delete a tag
      operationId: deleteTag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "204":
          description: Tag deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
        "404":
          $ref: '#/components/responses/NotFound'

  /issues/{issue_id}/deadline/:
    post:
      tags: [issues]
      summary: Set the deadline for an issue
      operationId: setIssueDeadline
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deadline:
                  type: string
                  format: date
                  description: "The deadline date (YYYY-MM-DD)."
                  example: '2026-06-01'
      responses:
        "200":
          description: Updated issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [issues]
      summary: Remove the deadline for an issue
      operationId: deleteIssueDeadline
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      responses:
        "200":
          description: Updated issue details (without deadline)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /issues/{issue_id}/assign/:
    post:
      tags: [issues]
      summary: Assign or unassign an issue
      operationId: assignIssue
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_to:
                  type: string
                  nullable: true
                  description: "Username of the assignee. Null or empty string to unassign."
                  example: 'john'
      responses:
        "200":
          description: Updated issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Your personal API key. Find it on your profile page in the web application.
        Send the raw 64-character hex value — no prefix required.

  responses:
    Unauthorized:
      description: 'Error: Unauthorized — API key missing or invalid'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            error401:
              value:
                message: 'Invalid API key.'
    Forbidden:
      description: 'Error: Forbidden — you do not have permission for this action'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            error403:
              value:
                message: 'You do not have permission to perform this action.'
    NotFound:
      description: 'Error: Not Found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            error404:
              value:
                message: "No resource with the given id found."
    BadRequest:
      description: 'Error: Bad Request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          examples:
            error400:
              value:
                message: 'subject: This field is required.'

  schemas:
    ErrorResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'Invalid API key.'

    User:
      type: object
      properties:
        username:
          type: string
          example: john
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john@example.com

    UserProfile:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        bio:
          type: string
          example: 'Software developer based in Barcelona.'
        avatar:
          type: string
          format: uri
          nullable: true
          example: 'https://projecte-asw1.onrender.com/media/avatars/john.jpg'

    IssueStatus:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'New'
        slug:
          type: string
          example: 'new'
        color:
          type: string
          example: '#83eede'
        is_closed:
          type: boolean
          example: false

    IssueUser:
      type: object
      properties:
        username:
          type: string
          example: john
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe

    IssueTag:
      type: object
      properties:
        name:
          type: string
          example: 'backend'
        slug:
          type: string
          example: 'backend'
        color:
          type: string
          example: '#70728f'

    IssueList:
      type: object
      properties:
        id:
          type: integer
          example: 42
        subject:
          type: string
          example: 'Login button not working on mobile'
        status:
          $ref: '#/components/schemas/IssueStatus'
        issue_type:
          type: string
          example: 'bug'
        severity:
          type: string
          example: 'critical'
        priority:
          type: string
          example: 'high'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/IssueTag'
        deadline:
          type: string
          format: date
          nullable: true
          example: '2026-06-01'
        deadline_status:
          type: string
          nullable: true
          enum: [red, orange, green]
          example: 'orange'
        assigned_to:
          allOf:
           - $ref: '#/components/schemas/IssueUser'
          nullable: true
        created_by:
          $ref: '#/components/schemas/IssueUser'
        created_at:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'
        modified_at:
          type: string
          format: date-time
          example: '2026-05-03T14:30:00Z'

    IssueDetail:
      allOf:
        - $ref: '#/components/schemas/IssueList'
        - type: object
          properties:
            description:
              type: string
              example: 'When tapping the login button on iOS Safari, nothing happens.'

    Watcher:
      type: object
      properties:
        user_id:
          type: integer
          example: 5
        username:
          type: string
          example: john
        created_at:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'

    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 7
        issue_id:
          type: integer
          example: 42
        author:
          $ref: '#/components/schemas/IssueUser'
        text:
          type: string
          example: 'I can reproduce this bug on iOS Safari.'
        created_at:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'
        modified_at:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'

    IssueActivity:
      type: object
      properties:
        id:
          type: integer
          example: 12
        actor:
          $ref: '#/components/schemas/IssueUser'
        action:
          type: string
          example: 'added comment via API'
        details:
          type: string
          example: 'I can reproduce this bug on iOS Safari.'
        created_at:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'

    IssueBulkInsertInput:
      type: object
      required: [issues_text]
      properties:
        issues_text:
          type: string
          description: >
            One issue per line using format `Subject | Description`.
            Description is optional.
          example: |
            Login button not working | Tap on mobile Safari does nothing
            Error when uploading avatar
        status_id:
          type: integer
          nullable: true
          description: >
            Optional status ID to apply to all created issues.
            If omitted, the default status is used.
          example: 1

    IssueBulkInsertResult:
      type: object
      properties:
        created_count:
          type: integer
          example: 2
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueList'

    IssueStatusUpdate:
      type: object
      required: [status_id]
      properties:
        status_id:
          type: integer
          example: 3

    IssueStatusInput:
      type: object
      required: [name, slug, color]
      properties:
        name:
          type: string
          example: 'In Review'
        slug:
          type: string
          example: 'in_review'
        color:
          type: string
          example: '#4c9aff'
        is_closed:
          type: boolean
          example: false
        order:
          type: integer
          example: 3

    IssueType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Bug'
        slug:
          type: string
          example: 'bug'
        color:
          type: string
          example: '#e44057'
        order:
          type: integer
          example: 0

    IssueTypeInput:
      type: object
      required: [name, slug, color]
      properties:
        name:
          type: string
          example: 'Bug'
        slug:
          type: string
          example: 'bug'
        color:
          type: string
          example: '#e44057'
        order:
          type: integer
          example: 0

    IssueSeverity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Critical'
        slug:
          type: string
          example: 'critical'
        color:
          type: string
          example: '#b91c1c'
        order:
          type: integer
          example: 4

    IssuePriority:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'High'
        slug:
          type: string
          example: 'high'
        color:
          type: string
          example: '#ef4444'
        order:
          type: integer
          example: 2

    IssueCatalogInput:
      type: object
      required: [name, slug, color]
      properties:
        name:
          type: string
          example: 'High'
        slug:
          type: string
          example: 'high'
        color:
          type: string
          example: '#ef4444'
        order:
          type: integer
          example: 2

    IssueTagInput:
      type: object
      required: [name, slug, color]
      properties:
        name:
          type: string
          example: 'backend'
        slug:
          type: string
          example: 'backend'
        color:
          type: string
          example: '#70728f'
