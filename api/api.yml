openapi: 3.0.2
info:
  version: 1.0.0
  title: Issue Tracker API
  description: >
    REST API for the **Issue Tracker** (Taiga clone) built for the ASW course at UPC.
    The web application is available at https://projecte-asw1.onrender.com.


    **Authentication**: All endpoints require an API key in the `Authorization` header.
    Find your key on your profile page in the web application.

servers:
  - url: 'https://projecte-asw1.onrender.com/api'

security:
  - ApiKeyAuth: []

paths:
  /:
    get:
      tags: [health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  user:
                    type: string
                    example: john
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users/:
    get:
      tags: [users]
      summary: List all users with their profiles
      operationId: listUsers
      responses:
        "200":
          description: Array of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users/{username}/:
    get:
      tags: [users]
      summary: Get a user's complete profile
      operationId: getUserProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: john
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [users]
      summary: Edit own profile (bio and/or avatar)
      operationId: updateUserProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: john
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bio:
                  type: string
                  example: 'Software developer based in Barcelona.'
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /issues/:
    get:
      tags: [issues]
      summary: List all issues
      operationId: listIssues
      parameters:
        - name: q
          in: query
          description: Search in subject and description
          required: false
          schema:
            type: string
          example: login
        - name: type
          in: query
          description: Filter by issue type slug (repeatable for OR logic)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [bug, question, enhancement]
        - name: severity
          in: query
          description: Filter by severity slug (repeatable for OR logic)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [wishlist, minor, normal, important, critical]
        - name: priority
          in: query
          description: Filter by priority slug (repeatable for OR logic)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [low, normal, high]
        - name: status
          in: query
          description: Filter by status slug (repeatable for OR logic)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [new, in_progress, ready_for_test, needs_info, closed, rejected, postponed]
        - name: assigned_to
          in: query
          description: Filter by assignee username (repeatable for OR logic)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example: john
        - name: created_by
          in: query
          description: Filter by creator username (repeatable for OR logic)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example: jane
        - name: sort
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [id, subject, status, issue_type, severity, priority, assigned_to, modified_at]
            default: modified_at
        - name: order
          in: query
          description: Sort direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Array of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueList'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /issues/bulk/:
    post:
      tags: [issues]
      summary: Bulk insert issues
      operationId: bulkInsertIssues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBulkInsertInput'
      responses:
        "201":
          description: Issues created by bulk insert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBulkInsertResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /issues/{issue_id}/:
    get:
      tags: [issues]
      summary: Get detail of an issue
      operationId: getIssue
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      responses:
        "200":
          description: Issue detail with nested data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [issues]
      summary: Delete an issue
      operationId: deleteIssue
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      responses:
        "204":
          description: Issue deleted successfully
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /issues/{issue_id}/status/:
    post:
      tags: [issues]
      summary: Update the status of an issue
      operationId: updateIssueStatus
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueStatusUpdate'
      responses:
        "200":
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 42
                  status:
                    type: string
                    example: 'In progress'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /issues/{issue_id}/comments/:
