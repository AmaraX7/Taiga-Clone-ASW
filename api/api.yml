      tags: [comments]
      summary: List comments of an issue
      operationId: listIssueComments
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [comments]
      summary: Create a new comment on an issue
      operationId: createIssueComment
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: 'I can reproduce this bug on iOS Safari.'
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /comments/{comment_id}/:
    put:
      tags: [comments]
      summary: Update a comment (author only)
      operationId: updateComment
      parameters:
        - name: comment_id
          in: path
          required: true
          schema:
            type: integer
          example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: 'Updated comment text after retesting.'
